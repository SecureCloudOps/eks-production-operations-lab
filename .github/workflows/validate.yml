name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Initialize validation dependencies
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform, YAML, scripts, documentation and evidence
        run: make validate
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          mkdir -p "$RUNNER_TEMP/kubeconform"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/kubeconform.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/kubeconform" kubeconform
          echo "$RUNNER_TEMP/kubeconform" >> "$GITHUB_PATH"
      - name: Kubernetes schemas
        run: make validate-schemas
