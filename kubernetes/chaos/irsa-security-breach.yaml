apiVersion: v1
kind: Namespace
metadata:
  name: lab04
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-web
  namespace: lab04
  # Annotate with the Terraform role ARN BEFORE starting the Deployment.
  # See labs/04-irsa-breach.md for the ordered setup commands.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web
  namespace: lab04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab04-public-web
  template:
    metadata:
      labels:
        app: lab04-public-web
    spec:
      serviceAccountName: public-web
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=Lab 04 public web demo"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Controlled simulation tooling; shares the pod's ServiceAccount identity.
        - name: aws-tools
          image: public.ecr.aws/aws-cli/aws-cli:2.27.49
          command: ["/bin/sh", "-c"]
          args: ["while true; do sleep 3600; done"]
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: public-web
  namespace: lab04
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  selector:
    app: lab04-public-web
  ports:
    - name: http
      port: 80
      targetPort: http
